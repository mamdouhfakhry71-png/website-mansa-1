<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المحادثة مع المعلم | MFX Student</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <button class="mfx-nav-toggle" onclick="toggleMfxNav()" aria-label="فتح القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <span style="color:var(--text-secondary); font-size:0.9rem;">مرحباً، <span id="nav-name">—</span></span>
        <button class="btn btn-ghost" onclick="logout()">🚪 خروج</button>
      </div>
    </div>
  </nav>

  <section style="padding: 110px 0 40px;">
    <div class="container" style="max-width:700px;">
      <h1 style="font-size:1.6rem; margin-bottom:4px;">💬 المحادثة مع المعلم</h1>
      <p style="color:var(--text-secondary); margin-bottom:24px;">اسأل معلمك عن أي حاجة محتاج توضيح فيها</p>

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); display:flex; flex-direction:column; height:60vh;">
        <div id="chat-messages" style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px;">
          <div class="skel" style="height:40px;"></div>
        </div>
        <div class="empty" id="chat-empty" style="display:none; padding:24px;">
          <div class="empty-icon" style="font-size:2.5rem;">💬</div>
          <h3>ابدأ المحادثة</h3>
          <p>اكتب أول رسالة لمعلمك</p>
        </div>
        <div style="display:flex; gap:10px; padding:16px; border-top:1px solid var(--border);">
          <input type="text" id="chat-input" class="inp" placeholder="اكتب رسالتك..." maxlength="4000" onkeydown="if(event.key==='Enter') sendChatMessage()">
          <button class="btn btn-primary" onclick="sendChatMessage()">إرسال</button>
        </div>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
