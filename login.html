<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل دخول الطالب | MFX</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script>
    (function () {
      try {
        var r = document.documentElement;
        var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var forced = /[?&]intro=1/.test(location.search);
        var seen = sessionStorage.getItem('mfx_login_intro');
        if (!rm && (forced || !seen)) {
          r.classList.add('mfx-intro', 'mfx-intro-stage');
          setTimeout(function () { r.classList.remove('mfx-intro'); }, 12000);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login-intro.css">
</head>
<body>
  <button type="button" class="theme-toggle theme-toggle-floating" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
    <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  </button>
  <div id="mfx-intro" aria-hidden="true">
    <div class="mi-ground"></div>
    <div class="mi-person">
      <svg viewBox="0 0 140 220">
        <ellipse class="mi-shadow" cx="70" cy="213" rx="36" ry="5"/>
        <g class="mi-body">
          <g class="mi-leg mi-leg-b"><g class="mi-thigh"><line class="c-pants" x1="66" y1="128" x2="66" y2="166" stroke-width="13" stroke-linecap="round"/><g class="mi-shin"><line class="c-pants" x1="66" y1="166" x2="66" y2="204" stroke-width="12" stroke-linecap="round"/><path class="c-shoe" d="M60 201 h18 q7 0 7 7 v2 h-25z"/></g></g></g>
          <g class="mi-arm mi-arm-free"><line x1="66" y1="78" x2="66" y2="114" style="stroke:var(--accent-deep)" stroke-width="11" stroke-linecap="round"/><circle class="c-skin" cx="66" cy="117" r="6"/></g>
          <rect class="c-hood" x="46" y="70" width="40" height="66" rx="16"/>
          <path d="M54 112 h24 v12 h-24z" class="c-hood2" opacity=".55"/>
          <g class="mi-leg mi-leg-f"><g class="mi-thigh"><line class="c-pants" x1="66" y1="128" x2="66" y2="166" stroke-width="13" stroke-linecap="round"/><g class="mi-shin"><line class="c-pants" x1="66" y1="166" x2="66" y2="204" stroke-width="12" stroke-linecap="round"/><path class="c-shoe" d="M60 201 h18 q7 0 7 7 v2 h-25z"/></g></g></g>
          <circle class="c-skin" cx="68" cy="52" r="20"/>
          <path class="c-hair" d="M48 48 Q50 30 70 30 Q90 32 89 48 Q80 38 66 40 Q56 42 48 48z"/>
          <circle cx="79" cy="53" r="2.6" fill="#222"/>
          <path d="M75 61 q6 4 11 -1" stroke="#a0452a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
          <path class="c-hood2" d="M52 38 v8 q16 9 32 0 v-8z"/>
          <polygon class="c-cap" points="32,32 68,17 104,32 68,46"/>
          <line x1="100" y1="33" x2="103" y2="52" class="c-tassel" stroke-width="2"/><circle class="c-tassel" cx="103" cy="54" r="3.2"/>
          <g class="mi-arm mi-arm-bag">
            <line x1="66" y1="78" x2="66" y2="114" style="stroke:var(--accent)" stroke-width="11" stroke-linecap="round"/>
            <g class="mi-bagswing"><g class="mi-bag">
              <path class="c-strap" d="M55 128 Q66 104 77 128"/>
              <rect class="c-bag" x="46" y="124" width="40" height="30" rx="8"/>
              <path class="c-bag2" d="M46 132 h40 v-2 a8 8 0 0 0 -8 -6 h-24 a8 8 0 0 0 -8 6z"/>
              <circle cx="66" cy="141" r="5.5" fill="#fff"/><polygon points="60,141 66,138 72,141 66,144" fill="var(--accent-deep)"/>
            </g></g>
            <circle class="c-skin" cx="66" cy="115" r="6.5"/>
          </g>
        </g>
      </svg>
    </div>
    <button type="button" class="mi-skip" id="mfx-skip">تخطي ⏭</button>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="index.html" class="logo" style="justify-content:center; margin-bottom:36px;">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <h2>تسجيل دخول الطالب</h2>
      <p>أدخل الكود الذي حصلت عليه من المعلم</p>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>كود الطالب</label>
          <input type="text" class="inp" id="login-code" placeholder="مثال: A7B9C2" required>
        </div>
        <div class="form-group">
          <label>الاسم الكامل</label>
          <input type="text" class="inp" id="login-name" placeholder="أدخل اسمك الثلاثي" required>
        </div>
        <div class="form-group">
          <label>رقم التليفون</label>
          <input type="tel" class="inp" id="login-phone" placeholder="01xxxxxxxxx" autocomplete="tel" required>
        </div>
        <div class="form-group">
          <label>رقم تليفون ولي الأمر</label>
          <input type="tel" class="inp" id="login-guardian-phone" placeholder="01xxxxxxxxx" autocomplete="tel" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%; margin-top:8px;">دخول</button>
      </form>

      <div style="margin-top:24px; text-align:center;">
        <p style="color:var(--text-muted); font-size:0.85rem;">
          ليس لديك كود؟ <span style="color:var(--text-secondary);">تواصل مع المعلم للحصول على كود دخول</span>
        </p>
      </div>
    </div>
  </div>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/login-intro.js"></script>
</body>
</html>
