<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة الطالب | MFX</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <button class="mfx-nav-toggle" onclick="toggleMfxNav()" aria-label="فتح القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <span style="color:var(--text-secondary); font-size:0.9rem;">مرحباً، <span id="nav-name">—</span></span>
        <button class="btn btn-ghost" onclick="logout()">🚪 خروج</button>
      </div>
    </div>
  </nav>

  <div class="container" style="padding-top: 100px;">
    <div style="margin-bottom:32px;">
      <h1 style="font-size:1.6rem;">مرحباً، <span id="student-name">—</span> 👋</h1>
      <p style="color:var(--text-secondary); margin-top:4px;">إليك ملخص تقدمك</p>
    </div>

    <!-- Stats -->
    <div class="grid-4" style="margin-bottom:32px;">
      <div class="stat-card">
        <div class="stat-value text-gradient" id="dash-courses">—</div>
        <div class="stat-label">كورس</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-gradient" id="dash-exams">—</div>
        <div class="stat-label">امتحان</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-gradient" id="dash-score">—</div>
        <div class="stat-label">متوسط النتيجة</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-gradient" id="dash-rank">—</div>
        <div class="stat-label">ترتيبك</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 32px;">
      <!-- My Progress -->
      <div>
        <h2 style="font-size:1.2rem; margin-bottom:16px;">تقدمي في الكورسات</h2>
        <div id="my-progress">
          <div class="skel" style="height:80px; margin-bottom:12px;"></div>
          <div class="skel" style="height:80px; margin-bottom:12px;"></div>
        </div>
        <div class="empty" id="progress-empty" style="display:none;">
          <div class="empty-icon">📊</div>
          <h3>لا يوجد تقدم بعد</h3>
        </div>
      </div>

      <!-- Recent Exams -->
      <div>
        <h2 style="font-size:1.2rem; margin-bottom:16px;">آخر الامتحانات</h2>
        <div id="recent-exams">
          <div class="skel" style="height:70px; margin-bottom:8px;"></div>
          <div class="skel" style="height:70px; margin-bottom:8px;"></div>
        </div>
        <div class="empty" id="exams-empty" style="display:none;">
          <div class="empty-icon">📝</div>
          <h3>لم تُجرِ أي امتحان بعد</h3>
        </div>
      </div>
    </div>

    <!-- Leaderboard -->
    <div style="margin-top:48px;" id="leaderboard">
      <h2 style="font-size:1.2rem; margin-bottom:16px;">🏆 لوحة المتصدرين</h2>
      <div id="leaderboard-list">
        <div class="skel" style="height:60px; margin-bottom:8px;"></div>
        <div class="skel" style="height:60px; margin-bottom:8px;"></div>
        <div class="skel" style="height:60px; margin-bottom:8px;"></div>
      </div>
      <div class="empty" id="leaderboard-empty" style="display:none;">
        <div class="empty-icon">🏆</div>
        <h3>لا يوجد ترتيب بعد</h3>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container"><p>© 2026 منصة ممدوح فخري التعليمية</p></div>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
