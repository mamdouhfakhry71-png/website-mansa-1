<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العرض التقديمي | MFX Student</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <button class="mfx-nav-toggle" onclick="toggleMfxNav()" aria-label="فتح القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="#" id="back-to-course" class="btn btn-ghost">← رجوع للكورس</a>
      </div>
    </div>
  </nav>
  <section class="viewer-section" style="padding: 110px 0 60px;">
    <div class="container viewer-container" style="max-width:1000px;">
      <h1 id="presentation-title" style="font-size:clamp(1.4rem, 3vw, 2rem); margin-bottom:20px;">جاري التحميل...</h1>
      <div id="presentation-viewer" class="viewer-frame-wrap" style="position:relative; padding-top:62%; background:#000; border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden;">
        <!-- Custom image-based viewer (used when the presentation was
             converted to Google Slides). Hidden by default; shown by
             initSlideViewer_() in app.js. -->
        <img id="slide-image" draggable="false" style="position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; background:#000;">

        <!-- Legacy Google Slides/file iframe embed — kept as the fallback
             for presentations that were never converted to Slides, so
             nothing already working breaks. -->
        <iframe id="presentation-frame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allowfullscreen></iframe>

        <!-- Renders on top of the viewer (pointer-events:none so slide
             navigation still works underneath) so any screenshot or
             recording carries the student's name/code and is traceable. -->
        <div id="presentation-watermark" style="position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:4;"></div>

        <!-- Custom nav bar — shown only in image-viewer mode. -->
        <div id="slide-controls" style="position:absolute; inset-inline:0; bottom:0; display:none; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; background:linear-gradient(transparent, rgba(0,0,0,0.7)); z-index:5;">
          <button type="button" class="btn btn-ghost" id="slide-prev-btn" onclick="prevSlide()" style="color:#fff;">◀ السابق</button>
          <span id="slide-counter" style="color:#fff; font-weight:600; font-size:0.9rem; white-space:nowrap;"></span>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn btn-ghost" id="slide-fullscreen-btn" onclick="toggleSlideFullscreen()" style="color:#fff;">⛶</button>
            <button type="button" class="btn btn-primary" id="slide-next-btn" onclick="nextSlide()">التالي ▶</button>
          </div>
        </div>
      </div>
      <p style="margin-top:16px; text-align:center; color:var(--text-muted); font-size:0.8rem;">
        هذا العرض خاص بك ولا يجوز مشاركته أو تصويره — اسمك وكودك ظاهرين عليه.
      </p>
    </div>
  </section>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
