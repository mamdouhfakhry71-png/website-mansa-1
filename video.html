<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفيديو | MFX Student</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <button class="mfx-nav-toggle" onclick="toggleMfxNav()" aria-label="فتح القائمة">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">كورساتي</a></li>
        <li><a href="dashboard.html">لوحتي</a></li>
        <li><a href="chat.html">💬 المعلم</a></li>
      </ul>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="#" id="back-to-course" class="btn btn-ghost">← رجوع للكورس</a>
      </div>
    </div>
  </nav>

  <section class="viewer-section" style="padding: 110px 0 60px;">
    <div class="container viewer-container" style="max-width:900px;">
      <h1 id="video-title" style="font-size:clamp(1.4rem, 3vw, 2rem); margin-bottom:20px;">جاري التحميل...</h1>

      <div class="viewer-frame-wrap" style="position:relative; padding-top:56.25%; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; margin-bottom:32px;">
        <iframe id="video-frame" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allow="autoplay" allowfullscreen></iframe>
      </div>

      <div style="background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius-lg); padding:24px;">
        <h3 style="margin-bottom:20px;">💬 التعليقات</h3>

        <div style="display:flex; gap:10px; margin-bottom:24px;">
          <input type="text" id="comment-input" class="inp" placeholder="اكتب تعليقك على الفيديو..." maxlength="2000" onkeydown="if(event.key==='Enter') postComment()">
          <button class="btn btn-primary" onclick="postComment()">إرسال</button>
        </div>

        <div id="comments-list" style="display:flex; flex-direction:column; gap:14px;">
          <div class="skel" style="height:50px;"></div>
        </div>
        <div class="empty" id="comments-empty" style="display:none; padding:24px 0;">
          <div class="empty-icon" style="font-size:2.5rem;">💬</div>
          <h3>لا توجد تعليقات بعد</h3>
          <p>كن أول من يعلق على هذا الفيديو</p>
        </div>
      </div>
    </div>
  </section>

  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
