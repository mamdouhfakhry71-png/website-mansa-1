<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكورس | MFX Student</title>
  <meta name="theme-color" content="#050505">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('mfx_theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <div class="logo-mark">🎓</div>
        <span class="text-gradient">MFX Student</span>
      </a>
      <div class="nav-actions">
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="تبديل الوضع الليلي/النهاري" title="تبديل الوضع">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <a href="index.html" class="btn btn-ghost">← كورساتي</a>
      </div>
    </div>
  </nav>

  <section style="padding: 140px 0 40px;">
    <div class="container">
      <div style="display:flex; gap:10px; margin-bottom:16px;" id="course-badges">
        <span class="badge badge-info">جاري التحميل...</span>
      </div>
      <h1 style="font-size:clamp(1.8rem, 4vw, 3rem); margin-bottom:16px;" id="course-title">جاري التحميل...</h1>
      <p style="color:var(--text-secondary); font-size:1.1rem; max-width:700px; margin-bottom:24px;" id="course-desc">...</p>
      <div style="display:flex; gap:24px; flex-wrap:wrap; color:var(--text-secondary); font-size:0.9rem;" id="course-meta">
        <span>⏳ جاري التحميل</span>
      </div>
    </div>
  </section>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this,'units')">📚 الوحدات</button>
        <button class="tab" onclick="switchTab(this,'exams')">📝 الامتحانات</button>
        <button class="tab" onclick="switchTab(this,'vocab')">🔊 القاموس</button>
      </div>

      <div id="tab-units">
        <div id="units-list">
          <div class="skel" style="height:60px; margin-bottom:8px;"></div>
          <div class="skel" style="height:60px; margin-bottom:8px;"></div>
        </div>
        <div class="empty" id="units-empty" style="display:none;">
          <div class="empty-icon">📁</div>
          <h3>لا توجد وحدات متاحة</h3>
        </div>
      </div>

      <div id="tab-vocab" style="display:none;">
        <p style="color:var(--text-secondary); margin-bottom:16px;">دوس تشغيل تسمع نطق الكلمة، وتقدر تغيّر السرعة قبل ما تسمع.</p>
        <div id="vocab-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div class="empty" id="vocab-empty" style="display:none;">
          <div class="empty-icon">🔊</div>
          <h3>مفيش كلمات في القاموس لسه</h3>
        </div>
      </div>


      <div id="tab-exams" style="display:none;">
        <div id="exams-list">
          <div class="skel" style="height:120px; margin-bottom:16px;"></div>
        </div>
        <div class="empty" id="exams-empty" style="display:none;">
          <div class="empty-icon">📝</div>
          <h3>لا توجد امتحانات متاحة</h3>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container"><p>© 2026 منصة ممدوح فخري التعليمية</p></div>
  </footer>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
